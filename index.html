<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Gift for Tazzy 🌸</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: linear-gradient(135deg, #ffe6e9 0%, #f0e6ff 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }
    .card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(8px);
      padding: 2.5rem 2rem;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      text-align: center;
      max-width: 420px;
      width: 90%;
      z-index: 10;
      border: 1px solid rgba(255, 255, 255, 0.6);
    }
    h1 {
      color: #d85a7fff;
      font-size: 1.8rem;
      margin-bottom: 1rem;
    }
    p {
      color: #555;
      font-size: 1.05rem;
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }
    .heart-btn {
      background-color: #ff758c;
      color: white;
      border: none;
      padding: 0.8rem 1.5rem;
      border-radius: 25px;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.2s, background-color 0.2s;
    }
    .heart-btn:hover {
      background-color: #ff4e6d;
      transform: scale(1.05);
    }
    
    /* Falling Flowers Animation */
    .flower {
      position: absolute;
      top: -50px;
      user-select: none;
      pointer-events: none;
      animation: fall linear infinite;
    }
    @keyframes fall {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(105vh) rotate(360deg);
        opacity: 0.2;
      }
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>A Surprise for Tazzy 🌸💖</h1>
    <p>
      Hey Tazzy! I just wanted to send you a little virtual magic today to remind you how awesome you are. Thank you for being such an incredible best friend!
    </p>
    <button class="heart-btn" onclick="extraLove()">Send Love 💕</button>
  </div>

  <script>
    const flowers = ['🌸', '🌺', '🌷', '✨', '💖'];

    function createFlower() {
      const flower = document.createElement('div');
      flower.classList.add('flower');
      flower.innerText = flowers[Math.floor(Math.random() * flowers.length)];
      flower.style.left = Math.random() * 100 + 'vw';
      flower.style.animationDuration = Math.random() * 3 + 2 + 's'; // 2s to 5s
      flower.style.fontSize = Math.random() * 15 + 15 + 'px'; // 15px to 30px
      
      document.body.appendChild(flower);

      setTimeout(() => {
        flower.remove();
      }, 5000);
    }

    // Generate falling flowers continuously
    setInterval(createFlower, 200);

    // Button click effect
    function extraLove() {
      for(let i = 0; i < 15; i++) {
        setTimeout(createFlower, i * 50);
      }
    }
  </script>

</body>
</html>
